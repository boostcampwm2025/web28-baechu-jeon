services:
  web:
    image: ghcr.io/${GITHUB_ACTOR}/repository-name/client:latest
    ports:
      - '${WEB_PORT}:${WEB_PORT}'
    environment:
      - PORT=${WEB_PORT}
    depends_on:
      - server

  nginx:
    image: nginx:stable-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - server

  server:
    # build 대신 image 사용
    image: ghcr.io/${GITHUB_ACTOR}/repository-name/server:latest
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'
    environment:
      - PORT=${SERVER_PORT}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:${DB_PORT}'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
