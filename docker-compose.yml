services:
  web:
    image: ghcr.io/boostcampwm2025/web28-show-me-the-gujo/client:latest
    ports:
      - '${WEB_PORT}:${WEB_PORT}'
    environment:
      - PORT=${WEB_PORT}
    depends_on:
      - server

  nginx:
    image: nginx:stable-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - server

  server:
    image: ghcr.io/boostcampwm2025/web28-show-me-the-gujo/server:latest
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'
    environment:
      - PORT=${SERVER_PORT}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEB_URL=${WEB_URL}
      - NCLOUD_ACCESS_KEY_ID=${NCLOUD_ACCESS_KEY_ID}
      - NCLOUD_SECRET_ACCESS_KEY=${NCLOUD_SECRET_ACCESS_KEY}
      - NCLOUD_S3_ENDPOINT=${NCLOUD_S3_ENDPOINT}
      - NCLOUD_BUCKET=${NCLOUD_BUCKET}
