name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

# 중복 실행 방지: 동일 브랜치에 새 푸시가 오면 진행 중인 기존 작업은 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: FE Lint & Type Check
        run: pnpm turbo run lint check-types --filter=web

      - name: FE Test
        run: pnpm turbo run test --filter=web
        continue-on-error: true # 현재 테스트 코드가 없으므로 실패해도 빌드 진행

      - name: FE Build
        run: pnpm turbo run build --filter=web

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: BE Lint & Type Check
        run: pnpm turbo run lint check-types --filter=server

      - name: BE Test
        run: pnpm turbo run test --filter=server

      - name: BE Build
        run: pnpm turbo run build --filter=server
