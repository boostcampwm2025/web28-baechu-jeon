name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to NCP Server
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && 
      github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 디렉토리 생성
      - name: Create directory first
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: mkdir -p ~/web28-baechu-jeon

      # docker-compose.yml, nginx.conf 파일을 서버로
      - name: Copy docker-compose to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: 'docker-compose.yml, nginx/nginx.conf'
          target: 'web28-baechu-jeon/'

      # 배포 실행
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          # 시크릿을 환경변수로 넘김
          envs: GHCR_PAT, GHCR_USERNAME, ENV_FILE_CONTENT
          script: |
            # 스크립트 실행 중 에러가 발생하면 즉시 중단
            set -e

            echo "🚀 배포 스크립트 시작: $(date)"

            # ~ (홈 디렉토리)로 이동
            cd ~/web28-baechu-jeon

            echo "$ENV_FILE_CONTENT" > .env
            echo "NODE_ENV=production" >> .env

            # GHCR 로그인
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            # 최신 이미지 가져오기
            docker compose pull

            # DB 마이그레이션을 서버 시작 전에 실행 (일회성 컨테이너)
            echo "🔄 Running database migrations..."
            docker compose run --rm -T server npx prisma migrate deploy

            # 배포 실행
            docker compose up -d --remove-orphans

            # 서버 정상 기동 확인
            echo "⏳ Waiting for server to be ready..."
            for i in $(seq 1 30); do
              if docker compose ps server | grep -q "running"; then
                echo "✅ Server is running"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Server failed to start"
                docker compose logs server
                exit 1
              fi
              sleep 2
            done

            # nginx 설정 리로드
            docker compose exec -T nginx nginx -s reload || true

            # 불필요한 미사용 이미지 삭제
            docker image prune -f

            echo "✅ Deployment completed!"
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
